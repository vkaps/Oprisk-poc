name: Run op risk model

on:
  workflow_dispatch:          # "Run workflow" button (works from the GitHub phone app)
  push:                       # rerun when code or inputs change
    branches: [main]
    paths: ["*.py", "inputs/**", "OpRisk_PoC.ipynb", ".github/workflows/**"]
  schedule:
    - cron: "17 6 3 * *"      # monthly, 3rd day 06:17 UTC - picks up new fines

permissions:
  contents: write             # to save the results back into the repository

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install pandas numpy scipy matplotlib openpyxl nbconvert ipykernel

      - name: 1. Extract fines (ESMA, FCA)
        run: |
          mkdir -p data logs
          set -o pipefail
          python -u extract_sources.py 2>&1 | tee logs/1_extract.log

      - name: 2. Build bank universe and match events
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
        run: |
          set -o pipefail
          python -u build_universe.py --sec-contact "$SEC_CONTACT" 2>&1 | tee logs/2_universe.log

      - name: 3. Run the workbook on real data
        env:
          OPRISK_DATA_MODE: REAL
        run: |
          set -o pipefail
          (jupyter nbconvert --to notebook --execute OpRisk_PoC.ipynb \
             --output OpRisk_PoC_executed.ipynb --ExecutePreprocessor.timeout=1800 &&
           jupyter nbconvert --to html OpRisk_PoC_executed.ipynb --output-dir results) 2>&1 | tee logs/3_workbook.log

      - name: Save results
        if: always()
        run: |
          git config user.name "oprisk-bot"
          git config user.email "oprisk-bot@users.noreply.github.com"
          git add -A .
          git commit -m "Model run $(date -u +%Y-%m-%d)" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
